CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_INPUT=y

# ZMK PR #3145 (Feb 2026): use board nice_nano//zmk variant (not nice_nano/nrf52840)
# The //zmk defconfig provides CONFIG_ZMK_BLE=y and CONFIG_ZMK_USB=y automatically.
# ZMK_SPLIT_BLE defaults y when ZMK_SPLIT && ZMK_BLE are set.
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_BLE=y

